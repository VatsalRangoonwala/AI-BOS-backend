name: ai-bos

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aibos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aibos_local}
      POSTGRES_DB: ${POSTGRES_DB:-aibos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      args:
        TARGET: api
    environment:
      APP_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      HTTP_ADDR: :8080
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-aibos}:${POSTGRES_PASSWORD:-aibos_local}@postgres:5432/${POSTGRES_DB:-aibos}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    stop_grace_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      args:
        TARGET: worker
    environment:
      APP_ENV: local
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-aibos}:${POSTGRES_PASSWORD:-aibos_local}@postgres:5432/${POSTGRES_DB:-aibos}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
