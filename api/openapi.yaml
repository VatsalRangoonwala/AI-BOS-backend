openapi: 3.1.0
info:
  title: AI-BOS API
  version: 0.2.0
  description: |
    Core REST API contract for the AI Business Operating System (AI-BOS).

    Clients may send `X-Request-Id`. The API preserves valid values (letters,
    digits, '.', '_', and '-' up to 128 characters) or generates a unique ID.
    Every response returns the effective ID in the `X-Request-Id` header and
    in the response JSON envelope.
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: getHealth
      summary: Check API process liveness
      description: Reports whether the API process can serve HTTP requests. It does not check dependencies.
      security: []
      responses:
        "200":
          description: The API process is alive.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                data:
                  status: ok
                meta:
                  requestId: req_0123456789abcdef0123456789abcdef

  /readyz:
    get:
      operationId: getReadiness
      summary: Check API dependency readiness
      description: Reports ready only when both PostgreSQL and Redis respond within their configured health timeouts.
      security: []
      responses:
        "200":
          description: All required dependencies are reachable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              example:
                data:
                  status: ready
                  dependencies:
                    postgres: ok
                    redis: ok
                meta:
                  requestId: req_0123456789abcdef0123456789abcdef
        "503":
          description: At least one required dependency is unavailable.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error:
                  code: dependency_unavailable
                  message: One or more required dependencies are unavailable
                  requestId: req_0123456789abcdef0123456789abcdef
                  details:
                    dependencies:
                      postgres: unavailable
                      redis: ok

  /api/v1/auth/register:
    post:
      operationId: register
      summary: Register a new user account
      description: Registers a user with email and password, creates an optional initial business, and returns auth tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered successfully.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/auth/login:
    post:
      operationId: login
      summary: Authenticate with email and password
      description: Validates user credentials and issues an access token along with a rotating refresh token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authentication successful.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/v1/auth/refresh:
    post:
      operationId: refreshTokens
      summary: Refresh access token
      description: Exchanges a valid rotating refresh token (from cookie or payload) for a new access token and rotated refresh token.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Tokens refreshed successfully.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: Revoke active session
      description: Revokes the current refresh session and clears session cookies.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Logged out successfully.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"

  /api/v1/auth/verify-email:
    post:
      operationId: verifyEmail
      summary: Verify user email address
      description: Consumes an email verification token and marks the account as verified.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
      responses:
        "200":
          description: Email verified successfully.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"

  /api/v1/auth/forgot-password:
    post:
      operationId: forgotPassword
      summary: Request password reset link
      description: Sends a password reset token to the registered email address if found.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Password reset link dispatched if account exists.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"

  /api/v1/auth/reset-password:
    post:
      operationId: resetPassword
      summary: Reset password with token
      description: Updates password using a valid reset token and revokes all active sessions.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset successfully.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"

  /api/v1/me:
    get:
      operationId: getCurrentUser
      summary: Get current authenticated user profile and memberships
      description: Returns the authenticated user record and all businesses where the user has active membership.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Authenticated user details.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/v1/businesses:
    get:
      operationId: listBusinesses
      summary: List user businesses
      description: Returns all businesses the authenticated user belongs to.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of accessible businesses.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
    post:
      operationId: createBusiness
      summary: Create a new business tenant
      description: Creates a new business tenant and assigns the creator as owner.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBusinessRequest"
      responses:
        "201":
          description: Business tenant created.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/businesses/{businessId}:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      operationId: getBusiness
      summary: Get business details
      description: Returns detailed business settings for a tenant where the caller is an active member.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Business tenant details.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessDetailResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    patch:
      operationId: updateBusiness
      summary: Update business settings
      description: Modifies business details. Requires owner role in the tenant.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBusinessRequest"
      responses:
        "200":
          description: Business updated successfully.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/businesses/{businessId}/members:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      operationId: listBusinessMembers
      summary: List members of a business
      description: Returns all active and invited members of the business tenant.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of team members.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /api/v1/businesses/{businessId}/invitations:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    post:
      operationId: inviteMember
      summary: Invite a new user to the business
      description: Creates an invitation for a member with a specified role. Requires owner role.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberRequest"
      responses:
        "201":
          description: Invitation created.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          $ref: "#/components/responses/ConflictError"

  /api/v1/businesses/{businessId}/members/{memberId}:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - name: memberId
        in: path
        required: true
        description: Unique ID of the membership record.
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateMember
      summary: Update member role or status
      description: Updates member permissions or status. Requires owner role.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRequest"
      responses:
        "200":
          description: Member record updated.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberDetailResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    delete:
      operationId: removeMember
      summary: Remove member from business
      description: Revokes membership from the tenant. Requires owner role.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Member removed successfully.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/businesses/{businessId}/customers:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      operationId: listCustomers
      summary: List customers
      description: Returns a paginated list of active customers for the business with optional text search.
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          description: Search query matching name, phone, or email.
          schema:
            type: string
        - name: limit
          in: query
          description: Maximum number of items to return (1-100).
          schema:
            type: integer
            default: 25
        - name: cursor
          in: query
          description: Opaque pagination cursor.
          schema:
            type: string
      responses:
        "200":
          description: Paginated customer list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
    post:
      operationId: createCustomer
      summary: Create customer
      description: Adds a new customer profile to the business.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCustomerRequest"
      responses:
        "201":
          description: Customer created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/businesses/{businessId}/customers/{customerId}:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - name: customerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getCustomer
      summary: Get customer details
      description: Retrieves customer profile by ID within the active tenant.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Customer profile details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDetailResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    patch:
      operationId: updateCustomer
      summary: Update customer
      description: Updates customer profile fields.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerRequest"
      responses:
        "200":
          description: Customer profile updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: archiveCustomer
      summary: Archive customer
      description: Soft-deletes/archives the customer profile.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Customer archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/businesses/{businessId}/customers/{customerId}/ledger:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - name: customerId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getCustomerLedger
      summary: Get customer ledger summary
      description: Retrieves customer outstanding receivables, billing totals, and payment summaries.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Customer ledger summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerLedgerResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/businesses/{businessId}/products:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      operationId: listProducts
      summary: List products
      description: Returns a paginated list of catalog products with current stock levels.
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          description: Search query matching name or SKU.
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated product list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
    post:
      operationId: createProduct
      summary: Create product
      description: Adds a new product to the catalog with optional initial stock.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductRequest"
      responses:
        "201":
          description: Product created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "409":
          $ref: "#/components/responses/ConflictError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/v1/businesses/{businessId}/products/{productId}:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProduct
      summary: Get product details
      description: Retrieves product details and stock balances by ID.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Product details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetailResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
    patch:
      operationId: updateProduct
      summary: Update product
      description: Updates product metadata, prices, or reorder levels.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductRequest"
      responses:
        "200":
          description: Product updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      operationId: archiveProduct
      summary: Archive product
      description: Soft-deletes/archives the product from active catalog.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Product archived.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/v1/businesses/{businessId}/products/{productId}/movements:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
      - name: productId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: listStockMovements
      summary: List product stock movements
      description: Retrieves audit trail of stock adjustments, inward receipts, and sales movements.
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated stock movements.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovementListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /api/v1/businesses/{businessId}/inventory:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    get:
      operationId: listInventory
      summary: List inventory levels
      description: Returns inventory balances with available quantities and low-stock warnings.
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: lowStock
          in: query
          description: Filter items where available quantity is at or below reorder level.
          schema:
            type: boolean
        - name: limit
          in: query
          schema:
            type: integer
            default: 25
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Paginated inventory levels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"

  /api/v1/businesses/{businessId}/inventory/adjustments:
    parameters:
      - $ref: "#/components/parameters/BusinessId"
    post:
      operationId: recordStockAdjustment
      summary: Adjust inventory stock
      description: Records an append-only stock movement and atomically updates the balance. Rejects negative stock.
      security:
        - BearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          description: Optional idempotency key to prevent double adjustment.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StockAdjustmentRequest"
      responses:
        "200":
          description: Stock movement recorded and balance updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockMovementDetailResponse"
        "400":
          $ref: "#/components/responses/BadRequestError"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "409":
          $ref: "#/components/responses/ConflictError"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token obtained via /api/v1/auth/login or /api/v1/auth/register.

  headers:
    RequestId:
      description: Correlates the response with API logs and traces.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: "^[A-Za-z0-9._-]+$"

  parameters:
    BusinessId:
      name: businessId
      in: path
      required: true
      description: Unique ID of the business tenant.
      schema:
        type: string
        format: uuid

  responses:
    BadRequestError:
      description: Malformed request or unparseable input.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    UnauthorizedError:
      description: Authentication is missing, expired, or invalid.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ForbiddenError:
      description: The caller lacks permissions or membership in this tenant.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFoundError:
      description: The requested resource was not found within the active tenant.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ConflictError:
      description: State conflict, such as email already registered or duplicate membership.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ValidationError:
      description: Semantic validation failed on one or more request fields.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    ResponseMeta:
      type: object
      additionalProperties: false
      required:
        - requestId
      properties:
        requestId:
          type: string
          minLength: 1
          maxLength: 128

    StandardSuccessResponse:
      type: object
      additionalProperties: false
      required:
        - data
        - meta
      properties:
        data: {}
        meta:
          $ref: "#/components/schemas/ResponseMeta"

    HealthData:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok

    HealthResponse:
      allOf:
        - $ref: "#/components/schemas/StandardSuccessResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/HealthData"

    DependencyStatuses:
      type: object
      additionalProperties: false
      required:
        - postgres
        - redis
      properties:
        postgres:
          $ref: "#/components/schemas/DependencyStatus"
        redis:
          $ref: "#/components/schemas/DependencyStatus"

    DependencyStatus:
      type: string
      enum:
        - ok
        - unavailable

    ReadinessData:
      type: object
      additionalProperties: false
      required:
        - status
        - dependencies
      properties:
        status:
          type: string
          const: ready
        dependencies:
          $ref: "#/components/schemas/DependencyStatuses"

    ReadinessResponse:
      allOf:
        - $ref: "#/components/schemas/StandardSuccessResponse"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ReadinessData"

    ErrorDetail:
      type: object
      additionalProperties: true

    StandardError:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - requestId
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
        message:
          type: string
          description: Human-safe message that does not expose internal errors or secrets.
        fieldErrors:
          type: object
          additionalProperties:
            type: string
        requestId:
          type: string
          minLength: 1
          maxLength: 128
        details:
          $ref: "#/components/schemas/ErrorDetail"

    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/StandardError"

    MessageData:
      type: object
      additionalProperties: false
      required:
        - message
      properties:
        message:
          type: string

    SuccessMessageResponse:
